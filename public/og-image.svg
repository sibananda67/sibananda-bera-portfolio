<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a10" />
      <stop offset="50%" stop-color="#0c1220" />
      <stop offset="100%" stop-color="#06080e" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowCyan" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#techGrid)" />

  <!-- Ambient Glows -->
  <rect width="1200" height="630" fill="url(#glowCyan)" />
  <rect width="1200" height="630" fill="url(#glowPurple)" />

  <!-- Framing Border -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="url(#cyanPurple)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Tech Traces & Circuit Details -->
  <g stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" fill="none">
    <path d="M 120 100 L 260 100 L 300 140 L 450 140" />
    <circle cx="120" cy="100" r="4" fill="#38bdf8" />
    <circle cx="450" cy="140" r="4" fill="#818cf8" />

    <path d="M 1080 530 L 940 530 L 900 490 L 750 490" />
    <circle cx="1080" cy="530" r="4" fill="#c084fc" />
    <circle cx="750" cy="490" r="4" fill="#818cf8" />
  </g>

  <!-- Status Pill Header -->
  <g transform="translate(600, 150)">
    <rect x="-180" y="-20" width="360" height="40" rx="20" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="-145" cy="0" r="4" fill="#38bdf8" />
    <text x="-130" y="5" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1.5">LIVE PORTFOLIO &amp; SYSTEMS</text>
    <text x="110" y="5" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">v2026.1</text>
  </g>

  <!-- Main Name Title -->
  <text x="600" y="270" font-family="'Syne', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">
    SIBANANDA BERA
  </text>

  <!-- Subtitle: DIGITAL SYSTEMS ARCHITECT -->
  <text x="600" y="340" font-family="'Syne', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="url(#cyanPurple)" text-anchor="middle" letter-spacing="4">
    DIGITAL SYSTEMS ARCHITECT
  </text>

  <!-- Separator Divider Line -->
  <line x1="420" y1="380" x2="780" y2="380" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />

  <!-- Positioning Domains: Technology • Automation • E-commerce -->
  <text x="600" y="430" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="500" fill="#cbd5e1" text-anchor="middle" letter-spacing="2">
    Technology • Automation • E-commerce
  </text>

  <!-- Bottom Interactive Metadata Badges -->
  <g transform="translate(600, 500)">
    <g transform="translate(-320, 0)">
      <rect x="-10" y="-16" width="180" height="32" rx="16" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
      <text x="80" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#7dd3fc" text-anchor="middle">⚙️ n8n &amp; Workflows</text>
    </g>

    <g transform="translate(-100, 0)">
      <rect x="-10" y="-16" width="200" height="32" rx="16" fill="rgba(129, 140, 248, 0.1)" stroke="rgba(129, 140, 248, 0.25)" stroke-width="1" />
      <text x="90" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#c7d2fe" text-anchor="middle">🛒 E-Commerce &amp; APIs</text>
    </g>

    <g transform="translate(130, 0)">
      <rect x="-10" y="-16" width="190" height="32" rx="16" fill="rgba(192, 132, 252, 0.1)" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1" />
      <text x="85" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#f0abfc" text-anchor="middle">🤖 AI-Assisted Systems</text>
    </g>
  </g>
</svg>
